      fill="white" font-size="14" font-weight="700">Agents  (reusable procedures — 3 total)</text>

<!-- 3 agent boxes side by side  y=560, h=82 -->
<rect x="12"   y="560" width="506" height="82" rx="5" fill="#bf360c"/>
<text x="265" y="578" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">legacy-analyzer</text>
<text x="265" y="595" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">Type: subagent (spawned by /analyze)</text>
<text x="265" y="611" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">Role: read-only — scores the source tree against detection</text>
<text x="265" y="627" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">signals in frameworks/*.md (role: source). Returns JSON.</text>

<rect x="548"  y="560" width="506" height="82" rx="5" fill="#bf360c"/>
<text x="801" y="578" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">unit-migrator</text>
<text x="801" y="595" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">Type: inline procedure (NOT a subagent)</text>
<text x="801" y="611" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">Role: per-unit translation — handles in-flight collision (A/B/C),</text>
<text x="801" y="627" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">acquires lock, ports source → target, finalizes unit file.</text>

<rect x="1084" y="560" width="504" height="82" rx="5" fill="#bf360c"/>
<text x="1336" y="578" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">permanent-gotchas</text>
<text x="1336" y="595" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">Type: reference catalog (disable-model-invocation: true)</text>
<text x="1336" y="611" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">Role: load-bearing framework bugs unreachable in &lt;30s via</text>
<text x="1336" y="627" text-anchor="middle" dominant-baseline="middle" fill="#ffccbc" font-size="10">search (e.g. passlib+bcrypt≥4 breakage, FastAPI editable install).</text>

