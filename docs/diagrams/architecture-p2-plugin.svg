     SKILLS SECTION  y=72..520
     ================================================================ -->
<rect x="0" y="72" width="1600" height="448" fill="#e8edf8"/>
<rect x="0" y="72" width="1600" height="32" fill="#1565c0"/>
<text x="800" y="88" text-anchor="middle" dominant-baseline="middle"
      fill="white" font-size="14" font-weight="700">Skills — 15 Slash Commands  (each is a SKILL.md loaded into Claude's context)</text>

<!-- Skills grid: 3 cols, 5 rows
     Each box has skill name + one-line purpose
     Col x: 12(w=500), 556(w=500), 1088(w=500)  rows y: 112,184,256,328,400  box h=64  gap=8 -->

<!-- ROW 1 -->
<rect x="12"   y="112" width="500" height="64" rx="5" fill="#1565c0"/>
<text x="32"   y="133" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:init</text>
<text x="32"   y="153" dominant-baseline="middle" fill="#bbdefb" font-size="10">Bootstrap migration: creates .claude/modernize/, copies migration.md template,</text>
<text x="32"   y="167" dominant-baseline="middle" fill="#bbdefb" font-size="10">detects git remote, patches .gitignore. Precondition: no state.json exists.</text>

<rect x="556"  y="112" width="500" height="64" rx="5" fill="#1565c0"/>
<text x="576"  y="133" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:analyze</text>
<text x="576"  y="153" dominant-baseline="middle" fill="#bbdefb" font-size="10">Spawns legacy-analyzer subagent to detect source stack; runs interactive interview</text>
<text x="576"  y="167" dominant-baseline="middle" fill="#bbdefb" font-size="10">for target choices. Writes analysis.json. Precondition: initialized.</text>

<rect x="1100" y="112" width="500" height="64" rx="5" fill="#1565c0"/>
<text x="1120" y="133" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:plan</text>
<text x="1120" y="153" dominant-baseline="middle" fill="#bbdefb" font-size="10">Reads migration.md (validates 11 REQUIRED sections) + analysis.json; generates</text>
<text x="1120" y="167" dominant-baseline="middle" fill="#bbdefb" font-size="10">ordered units/*.json files and plan.md. Precondition: analyzed.</text>

<!-- ROW 2 -->
<rect x="12"   y="184" width="500" height="64" rx="5" fill="#0d47a1"/>
<text x="32"   y="205" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:scaffold</text>
<text x="32"   y="225" dominant-baseline="middle" fill="#bbdefb" font-size="10">Creates target UI/API/DB skeleton using framework .md recipes; copies legacy</text>
<text x="32"   y="239" dominant-baseline="middle" fill="#bbdefb" font-size="10">static assets. Writes verify.config.json. Precondition: planned.</text>

<rect x="556"  y="184" width="500" height="64" rx="5" fill="#0d47a1"/>
<text x="576"  y="205" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:auth</text>
<text x="576"  y="225" dominant-baseline="middle" fill="#bbdefb" font-size="10">Migrates authentication end-to-end (login · logout · session · password hashing).</text>
<text x="576"  y="239" dominant-baseline="middle" fill="#bbdefb" font-size="10">Reads API target's auth notes. Creates __auth__.json unit. Precondition: scaffolded.</text>

<rect x="1100" y="184" width="500" height="64" rx="5" fill="#0d47a1"/>
<text x="1120" y="205" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:next</text>
<text x="1120" y="225" dominant-baseline="middle" fill="#bbdefb" font-size="10">Auto-selects next eligible unit (respects depends_on graph); delegates to</text>
<text x="1120" y="239" dominant-baseline="middle" fill="#bbdefb" font-size="10">unit-migrator agent inline. Precondition: auth_done or in_progress.</text>

<!-- ROW 3 -->
<rect x="12"   y="256" width="500" height="64" rx="5" fill="#1976d2"/>
<text x="32"   y="277" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:migrate  &lt;unit-id&gt;</text>
<text x="32"   y="297" dominant-baseline="middle" fill="#bbdefb" font-size="10">Explicitly migrate a named unit (bypasses auto-selection). Supports --force to</text>
<text x="32"   y="311" dominant-baseline="middle" fill="#bbdefb" font-size="10">override unmet depends_on. Same migration loop as /next.</text>

<rect x="556"  y="256" width="500" height="64" rx="5" fill="#1976d2"/>
<text x="576"  y="277" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:verify  [unit-id]</text>
<text x="576"  y="297" dominant-baseline="middle" fill="#bbdefb" font-size="10">Runs lint · typecheck · tests from verify.config.json; transitions unit status</text>
<text x="576"  y="311" dominant-baseline="middle" fill="#bbdefb" font-size="10">migrated → verified (or → failed). Precondition: at least 1 migrated unit.</text>

<rect x="1100" y="256" width="500" height="64" rx="5" fill="#1976d2"/>
<text x="1120" y="277" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:status</text>
<text x="1120" y="297" dominant-baseline="middle" fill="#bbdefb" font-size="10">Read-only dashboard: overall phase, per-unit progress, in-flight heartbeats,</text>
<text x="1120" y="311" dominant-baseline="middle" fill="#bbdefb" font-size="10">blockers, suggested next action. Never mutates state. Any status.</text>

<!-- ROW 4 -->
<rect x="12"   y="328" width="500" height="64" rx="5" fill="#1976d2"/>
<text x="32"   y="349" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:report  [--format=html|json|md]</text>
<text x="32"   y="369" dominant-baseline="middle" fill="#bbdefb" font-size="10">Generates stakeholder report with burndown, velocity, risk assessment, effort</text>
<text x="32"   y="383" dominant-baseline="middle" fill="#bbdefb" font-size="10">breakdown. Saves to .claude/modernize/reports/. Precondition: in_progress+.</text>

<rect x="556"  y="328" width="500" height="64" rx="5" fill="#1976d2"/>
<text x="576"  y="349" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:sync</text>
<text x="576"  y="369" dominant-baseline="middle" fill="#bbdefb" font-size="10">Reconciles state.json + per-unit files after git pull from a team member.</text>
<text x="576"  y="383" dominant-baseline="middle" fill="#bbdefb" font-size="10">Merges unit_ids[], stacks, scaffold cleanly. Requires no uncommitted changes.</text>

<rect x="1100" y="328" width="500" height="64" rx="5" fill="#1976d2"/>
<text x="1120" y="349" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:retry  &lt;unit-id&gt;</text>
<text x="1120" y="369" dominant-baseline="middle" fill="#bbdefb" font-size="10">Re-attempts a failed unit. Supports --with-prompt to inject additional guidance</text>
<text x="1120" y="383" dominant-baseline="middle" fill="#bbdefb" font-size="10">into the migration context. Resets in_flight, reruns translation loop.</text>

<!-- ROW 5 -->
<rect x="12"   y="400" width="500" height="64" rx="5" fill="#4a148c"/>
<text x="32"   y="421" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:rollback  --unit &lt;id&gt;</text>
<text x="32"   y="441" dominant-baseline="middle" fill="#e1bee7" font-size="10">Reverts one unit's target files; resets unit status to pending. Non-destructive to</text>
<text x="32"   y="455" dominant-baseline="middle" fill="#e1bee7" font-size="10">other units. Precondition: unit is migrated, verified, or failed.</text>

<rect x="556"  y="400" width="500" height="64" rx="5" fill="#4a148c"/>
<text x="576"  y="421" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:abandon  [--soft|--hard|--unit]</text>
<text x="576"  y="441" dominant-baseline="middle" fill="#e1bee7" font-size="10">Destructive: --soft clears state.json, --hard also deletes scaffold dirs,</text>
<text x="576"  y="455" dominant-baseline="middle" fill="#e1bee7" font-size="10">--unit marks one unit as skipped. Requires confirmation. No in-flight units.</text>

<rect x="1100" y="400" width="500" height="64" rx="5" fill="#4a148c"/>
<text x="1120" y="421" dominant-baseline="middle" fill="white" font-size="12" font-weight="700">/web-modernize:unlock</text>
<text x="1120" y="441" dominant-baseline="middle" fill="#e1bee7" font-size="10">Force-clears the advisory lock on state.json (10-min TTL). Only /plan and</text>
<text x="1120" y="455" dominant-baseline="middle" fill="#e1bee7" font-size="10">/scaffold are guarded by this lock. Requires typing "force-clear".</text>

<!-- Skill inheritance note -->
<rect x="12" y="474" width="1576" height="28" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
<text x="800" y="488" text-anchor="middle" dominant-baseline="middle" fill="#0d47a1" font-size="10">
  All skills read state.json on entry to check precondition and redirect if status is wrong. Skills cannot invoke other skills — they instruct Claude to suggest the next command.
</text>

